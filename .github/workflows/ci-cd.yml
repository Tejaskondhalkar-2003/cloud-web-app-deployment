
name: DevOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check required application files
        run: |
          test -f app/index.html
          test -f app/style.css
          test -f app/script.js
          echo "All required application files exist."

      - name: Check JavaScript syntax
        run: node --check app/script.js

      - name: Test HTML structure
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path("app/index.html").read_text().lower()
          assert "<html" in html, "Missing HTML opening tag"
          assert "</html>" in html, "Missing HTML closing tag"
          assert "<body" in html, "Missing body opening tag"
          assert "</body>" in html, "Missing body closing tag"
          print("HTML structure checks passed.")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cloud-web-app-deployment:ci

  deploy-to-ec2:
    name: Deploy to AWS EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy application through Systems Manager
        env:
          INSTANCE_ID: i-0003c8d54ae649983
        run: |
          set -eu

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy application from GitHub Actions" \
            --parameters 'commands=[
              "set -eu",
              "cd /home/ubuntu/cloud-web-app-deployment",
              "git pull --ff-only origin main",
              "docker compose up -d --build",
              "docker compose ps"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json
