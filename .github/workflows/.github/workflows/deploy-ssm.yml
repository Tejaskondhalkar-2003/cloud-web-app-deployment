
name: Deploy to EC2 via AWS SSM

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy application
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::648617468703:role/GitHubActions-SSM-Deploy
          aws-region: us-east-1

      - name: Deploy application through SSM
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0003c8d54ae649983" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy cloud web application from GitHub Actions" \
            --parameters 'commands=[
              "export HOME=/root",
              "git config --global --add safe.directory /home/ubuntu/cloud-web-app-deployment",
              "cd /home/ubuntu/cloud-web-app-deployment && git pull --ff-only origin main",
              "cd /home/ubuntu/cloud-web-app-deployment && docker compose up -d --build"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0003c8d54ae649983"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0003c8d54ae649983" \
            --query "{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}" \
            --output json
